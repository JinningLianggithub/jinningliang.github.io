---
layout: default
title: Research
math: false
---

<section class="page">
    <div class="container">
        <header class="page-head">
            <h1>Research</h1>
        </header>
        <ul class="project-grid project-grid--wide">
            {% for p in site.data.research %}
            <li>
                <a class="project" href="{{ p.url | relative_url }}">
                    <span class="project__figure"><img src="{{ p.image | relative_url }}" alt=""{% unless forloop.first %} loading="lazy"{% endunless %}></span>
                    <span class="project__title">{{ p.title }}</span>
                    <span class="project__meta"><span>{{ p.venue }}</span> <span class="num">{{ p.year }}</span></span>
                </a>
            </li>
            {% endfor %}
        </ul>
    </div>
</section>
